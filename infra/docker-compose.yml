# NetSentinel-AI infrastructure.
#
# Profiles exist because of the 16 GB VM, not for elegance. Wazuh alone wants 4-5 GB,
# so the rest of the stack has to be brought up in groups and the memory caps here are
# deliberate: without them one runaway container takes the whole box down, and on a
# single-VM deployment that means losing the sensors too.
#
#   docker compose --profile storage up -d     # PostgreSQL + ClickHouse
#   docker compose --profile bus up -d         # Redpanda
#   docker compose --profile ingest up -d      # Vector
#   docker compose --profile lab up -d         # the victim/attacker lab
#   docker compose --profile sensors up -d     # Suricata + Zeek on the lab bridge
#   docker compose --profile dashboards up -d  # Grafana
#   docker compose --profile intel up -d       # MISP + Keep
#   docker compose --profile response up -d    # CrowdSec Local API
#
# Rough budget: storage 2.5 GB, bus 1 GB, ingest 0.25 GB, sensors 2 GB, lab 0.5 GB,
# dashboards 0.25 GB. About 6.5 GB, leaving room for Wazuh and the OS.
#
# intel adds about 2.5 GB and does not fit alongside Wazuh. It is its own profile for
# that reason: threat intelligence enriches alerts, it does not produce them, so the
# detection path runs without it and the two can take turns on a single VM.

name: netsentinel

networks:
  # A fixed bridge name so the sensors can be pointed at a predictable interface.
  # Docker's default name is br-<hash>, which changes whenever the network is
  # recreated and would silently leave Suricata sniffing nothing.
  lab:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: netsentinel-lab
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backplane:
    driver: bridge

volumes:
  postgres-data:
  clickhouse-data:
  redpanda-data:
  grafana-data:
  suricata-logs:
  zeek-logs:
  misp-data:
  misp-db:
  keep-data:
  crowdsec-config:
  crowdsec-data:

services:
  # --- storage --------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    profiles: [storage]
    environment:
      POSTGRES_DB: netsentinel
      POSTGRES_USER: ${POSTGRES_USER:-netsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Bound to localhost only. Everything reaches this box through the SSH tunnel;
    # publishing on 0.0.0.0 would expose it to the internet. The host port is
    # overridable because a developer laptop often already has something on 5432,
    # and the container port never changes - only where it is reachable from.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    mem_limit: 512m
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netsentinel} -d netsentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: [storage]
    environment:
      CLICKHOUSE_DB: netsentinel
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-netsentinel}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Generated from the feature contract; see core/features/clickhouse.py.
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    mem_limit: 2g
    # ClickHouse opens a lot of files and the default container limit is too low.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks: [backplane]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- bus ------------------------------------------------------------------

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    profiles: [bus]
    command:
      - redpanda
      - start
      # Sized for a shared 16 GB box: one core, a hard 1 GB cap, and
      # --overprovisioned so it does not assume it owns the CPU.
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "127.0.0.1:9092:9092"
    mem_limit: 1200m
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # --- ingest ---------------------------------------------------------------

  vector:
    image: timberio/vector:0.41.1-alpine
    profiles: [ingest]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-netsentinel}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - suricata-logs:/var/log/suricata:ro
      - zeek-logs:/var/log/zeek:ro
    mem_limit: 256m
    networks: [backplane]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  # --- sensors --------------------------------------------------------------

  suricata:
    image: jasonish/suricata:7.0
    profiles: [sensors]
    # Host networking so it can see the lab bridge. A container on the lab network
    # would only see traffic addressed to itself.
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    command: ["-i", "netsentinel-lab", "--set", "vars.address-groups.HOME_NET=[172.30.0.0/24]"]
    volumes:
      - suricata-logs:/var/log/suricata
      - ./suricata/rules:/var/lib/suricata/rules
    mem_limit: 1g
    restart: unless-stopped

  zeek:
    image: zeek/zeek:6.0
    profiles: [sensors]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    command: ["zeek", "-i", "netsentinel-lab", "-C", "LogAscii::use_json=T"]
    working_dir: /var/log/zeek
    volumes:
      - zeek-logs:/var/log/zeek
    mem_limit: 1g
    restart: unless-stopped

  # --- the lab --------------------------------------------------------------

  victim-web:
    image: nginx:1.27-alpine
    profiles: [lab]
    networks:
      lab:
        ipv4_address: 172.30.0.10
    mem_limit: 64m
    restart: unless-stopped

  victim-ssh:
    image: linuxserver/openssh-server:9.7_p1-r4-ls171
    profiles: [lab]
    environment:
      # A weak password on purpose: this is the brute-force target for the D14
      # hydra run. It is reachable only from the lab bridge.
      USER_NAME: labuser
      USER_PASSWORD: password123
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
    networks:
      lab:
        ipv4_address: 172.30.0.11
    mem_limit: 128m
    restart: unless-stopped

  benign-traffic:
    image: alpine:3.20
    profiles: [lab]
    # Steady, unremarkable traffic. Without it the models learn that "any traffic at
    # all" means an attack, which is the classic way a lab-trained IDS fails.
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1
        while true; do
          curl -s -o /dev/null http://172.30.0.10/ || true
          sleep $$(( (RANDOM % 5) + 2 ))
        done
    networks: [lab]
    mem_limit: 64m
    restart: unless-stopped

  attacker:
    image: instrumentisto/nmap:7.95
    profiles: [lab]
    # Idles until driven by hand: docker compose exec attacker nmap -sS 172.30.0.10
    entrypoint: ["sleep", "infinity"]
    networks:
      lab:
        ipv4_address: 172.30.0.100
    mem_limit: 128m
    restart: unless-stopped

  # --- dashboards -----------------------------------------------------------

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [dashboards]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 256m
    networks: [backplane]
    restart: unless-stopped

  # --- threat intelligence and SOAR -----------------------------------------
  #
  # Both are enrichment. The pipeline detects, stores, explains and alerts with this
  # profile down; what it loses is the "known-bad" label on an alert and the
  # de-duplication in front of the analyst.

  misp-db:
    image: mariadb:10.11
    profiles: [intel]
    environment:
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:?set MISP_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MISP_DB_ROOT_PASSWORD:?set MISP_DB_ROOT_PASSWORD in .env}
    command: --innodb-buffer-pool-size=256M --innodb-change-buffering=none
    volumes:
      - misp-db:/var/lib/mysql
    mem_limit: 768m
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  misp-redis:
    image: redis:7-alpine
    profiles: [intel]
    command: redis-server --save "" --maxmemory 128mb --maxmemory-policy allkeys-lru
    mem_limit: 192m
    networks: [backplane]
    restart: unless-stopped

  misp:
    image: ghcr.io/misp/misp-docker/misp-core:v2.5.17
    profiles: [intel]
    depends_on:
      misp-db:
        condition: service_healthy
      misp-redis:
        condition: service_started
    environment:
      BASE_URL: ${MISP_BASE_URL:-http://localhost:8081}
      ADMIN_EMAIL: ${MISP_ADMIN_EMAIL:-admin@netsentinel.local}
      ADMIN_PASSWORD: ${MISP_ADMIN_PASSWORD:?set MISP_ADMIN_PASSWORD in .env}
      MYSQL_HOST: misp-db
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:?set MISP_DB_PASSWORD in .env}
      REDIS_HOST: misp-redis
      # Warninglists are what keep 8.8.8.8 out of the feed, and the sync asks MISP to
      # enforce them. They have to be loaded for that request to mean anything.
      ENABLE_DB_SETTINGS: "true"
    volumes:
      - misp-data:/var/www/MISP/app/files
    ports:
      - "127.0.0.1:8081:80"
    mem_limit: 1536m
    networks: [backplane]
    restart: unless-stopped

  keep:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-api:0.33.6
    profiles: [intel]
    environment:
      DATABASE_CONNECTION_STRING: sqlite:////state/keep.db
      KEEP_API_KEY: ${KEEP_API_KEY:?set KEEP_API_KEY in .env}
      AUTH_TYPE: ${KEEP_AUTH_TYPE:-NO_AUTH}
      SECRET_MANAGER_TYPE: FILE
      SECRET_MANAGER_DIRECTORY: /state
    volumes:
      - keep-data:/state
    ports:
      - "127.0.0.1:8082:8080"
    mem_limit: 512m
    networks: [backplane]
    restart: unless-stopped

  # --- response -------------------------------------------------------------

  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.3
    profiles: [response]
    environment:
      # The Local API only. CrowdSec's own log parsers and scenarios are a second
      # detection engine, and this deployment already has one: decisions here come
      # from an analyst approving an action, not from CrowdSec deciding by itself.
      DISABLE_AGENT: "true"
      DISABLE_ONLINE_API: "true"
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
    ports:
      # The responder reaches this over the backplane; the port is published so
      # `cscli` on the host can register machines and bouncers.
      - "127.0.0.1:8080:8080"
    mem_limit: 256m
    networks: [backplane]
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
