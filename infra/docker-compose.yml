# NetSentinel-AI infrastructure.
#
# Profiles exist because of the 16 GB VM, not for elegance. Wazuh alone wants 3 GB
# even with its heap tuned down, so the rest of the stack has to be brought up in
# groups and the memory caps here are deliberate: without them one runaway container
# takes the whole box down, and on a single-VM deployment that means losing the
# sensors too.
#
#   docker compose --profile storage up -d     # PostgreSQL + ClickHouse
#   docker compose --profile bus up -d         # Redpanda
#   docker compose --profile ingest up -d      # Vector
#   docker compose --profile lab up -d         # the victim/attacker lab
#   docker compose --profile sensors up -d     # Suricata + Zeek on the lab bridge
#   docker compose --profile storage --profile bus --profile pipeline up -d --build
#                                              # sensor, Tier C, writer, sinks
#   docker compose --profile dashboards up -d  # Grafana
#   docker compose --profile intel up -d       # MISP + Keep
#   docker compose --profile response up -d    # CrowdSec Local API
#   docker compose --profile app up -d --build # PostgreSQL + API + dashboard
#   docker compose --profile hids up -d        # Wazuh manager, indexer, dashboard
#   docker compose --profile case up -d        # DFIR-IRIS
#   docker compose --profile scan up -d        # Greenbone, for a scan window
#
# Budget, as the sum of the memory caps below: storage 2.5 GB, bus 1.2 GB, ingest
# 0.25 GB, sensors 2 GB, pipeline 1.7 GB, lab 0.4 GB, dashboards 0.25 GB, response
# 0.25 GB, app 0.6 GB beyond storage. About 9.1 GB; with hids (3 GB) that is the
# always-on core, 12.1 GB.
#
# intel (2.9 GB), case (1.6 GB) and scan (4.3 GB once its one-shot containers exit)
# are separate profiles and take turns. Core + case is 13.7 GB. Core + intel is
# 15.0 GB, which leaves about 1 GB for the OS: too tight to leave running, so for the
# demo stop hids or dashboards alongside it. Core + scan (16.4 GB) does not fit;
# scan needs hids stopped. None of the three produces
# detections: threat intelligence enriches alerts, IRIS holds the cases, Greenbone
# runs in a window. The detection path runs with all three stopped.

name: netsentinel

networks:
  # A fixed bridge name so the sensors can be pointed at a predictable interface.
  # Docker's default name is br-<hash>, which changes whenever the network is
  # recreated and would silently leave Suricata sniffing nothing.
  lab:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: netsentinel-lab
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backplane:
    driver: bridge

volumes:
  postgres-data:
  clickhouse-data:
  redpanda-data:
  grafana-data:
  suricata-logs:
  zeek-logs:
  misp-data:
  misp-db:
  keep-data:
  crowdsec-config:
  crowdsec-data:
  # hids (Wazuh), named as upstream
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  # case (DFIR-IRIS)
  iris-db-data:
  iris-downloads:
  iris-user-templates:
  iris-server-data:
  # scan (Greenbone)
  gvm-gpg-data:
  gvm-scap-data:
  gvm-cert-data:
  gvm-data-objects:
  gvm-gvmd-data:
  gvm-psql-data:
  gvm-vt-data:
  gvm-notus-data:
  gvm-psql-socket:
  gvm-gvmd-socket:
  gvm-ospd-socket:
  gvm-redis-socket:
  gvm-openvas-data:
  gvm-openvas-log:

services:
  # --- storage --------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    # In the app profile too, so the API and dashboard come up with one command.
    profiles: [storage, app]
    environment:
      POSTGRES_DB: netsentinel
      POSTGRES_USER: ${POSTGRES_USER:-netsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Bound to localhost only. Everything reaches this box through the SSH tunnel;
    # publishing on 0.0.0.0 would expose it to the internet. The host port is
    # overridable because a developer laptop often already has something on 5432,
    # and the container port never changes - only where it is reachable from.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    mem_limit: 512m
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netsentinel} -d netsentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- application ----------------------------------------------------------

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    profiles: [app]
    environment:
      # NETSENTINEL_DB selects the database inside PostgreSQL; the demonstration
      # database built by lab/replay/build_demo.ps1 is netsentinel_demo.
      NETSENTINEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-netsentinel}:${POSTGRES_PASSWORD}@postgres:5432/${NETSENTINEL_DB:-netsentinel}
      # Not ":?" here: compose interpolates every profile before choosing one, and a
      # required variable would stop "--profile storage" on a machine without it. The
      # API itself refuses to start without a signing key.
      NETSENTINEL_JWT_SECRET: ${NETSENTINEL_JWT_SECRET:-}
      # What the pipeline's sensor presents to read which models are active. Blank
      # turns that endpoint off, and the sensor then refuses to start.
      NETSENTINEL_SENSOR_TOKEN: ${NETSENTINEL_SENSOR_TOKEN:-}
      # Flow counts for the dashboard's activity strip. Optional, and not ":?" for
      # the reason above: blank, or with storage down, the strip shows alerts and
      # no flow counts. No depends_on, because clickhouse is in another profile.
      NETSENTINEL_CLICKHOUSE_URL: http://clickhouse:8123
      NETSENTINEL_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-netsentinel}
      NETSENTINEL_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Localhost only, like every other port here. 8010 rather than 8000, which other
    # services on a shared machine tend to hold.
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    mem_limit: 512m
    networks: [backplane]
    restart: unless-stopped

  dashboard:
    build: ../frontend
    profiles: [app]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-5180}:443"
    mem_limit: 64m
    networks: [backplane]
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: [storage]
    environment:
      CLICKHOUSE_DB: netsentinel
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-netsentinel}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Generated from the feature contract; see core/features/clickhouse.py.
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    mem_limit: 2g
    # ClickHouse opens a lot of files and the default container limit is too low.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks: [backplane]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- bus ------------------------------------------------------------------

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    profiles: [bus]
    command:
      - redpanda
      - start
      # Sized for a shared 16 GB box: one core, a hard 1 GB cap, and
      # --overprovisioned so it does not assume it owns the CPU.
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "127.0.0.1:9092:9092"
    mem_limit: 1200m
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # One-shot: create the topics before anything produces to them. Auto-creation would
  # also make them, but with whatever defaults the broker has at that moment, and the
  # dead-letter topic would not exist until the first malformed flow - which is when
  # the writer needs it to already be there. Names from netsentinel_core.bus
  # (FLOW_TOPIC, TIER_C_TOPIC) and the DEAD_LETTER_TOPIC of netsentinel_writer.flow_sink
  # and netsentinel_writer.tier_c_sink.
  # Idempotent: an existing topic is left alone.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    profiles: [bus]
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in netsentinel.flows netsentinel.flows.tier_c netsentinel.flows.deadletter \
                     netsentinel.flows.tier_c.deadletter; do
          rpk topic describe "$$topic" -X brokers=redpanda:9092 >/dev/null 2>&1 ||
            rpk topic create "$$topic" --replicas 1 -X brokers=redpanda:9092 || exit 1
        done
    mem_limit: 128m
    networks: [backplane]
    restart: "no"

  # --- ingest ---------------------------------------------------------------

  vector:
    image: timberio/vector:0.41.1-alpine
    profiles: [ingest]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-netsentinel}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - suricata-logs:/var/log/suricata:ro
      - zeek-logs:/var/log/zeek:ro
    mem_limit: 256m
    networks: [backplane]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  # --- sensors --------------------------------------------------------------

  suricata:
    image: jasonish/suricata:8.0.7
    profiles: [sensors]
    # Host networking so it can see the lab bridge. A container on the lab network
    # would only see traffic addressed to itself.
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    # The stock suricata.yaml plus our overrides: lab address groups and JA4.
    command: ["-i", "netsentinel-lab", "--include", "/etc/netsentinel/suricata.yaml"]
    volumes:
      - suricata-logs:/var/log/suricata
      # ET Open, fetched once by suricata-update (see README); not committed.
      - ./suricata/rules:/var/lib/suricata/rules
      # Outside /etc/suricata: the image's entrypoint chowns that whole directory and
      # exits when it meets a read-only file there.
      - ./suricata/netsentinel.yaml:/etc/netsentinel/suricata.yaml:ro
    mem_limit: 1g
    restart: unless-stopped

  zeek:
    # zeek/zeek:8.0.10 with the JA4+ scripts installed; see zeek/Dockerfile.
    build: ./zeek
    image: netsentinel/zeek:8.0.10-ja4
    profiles: [sensors]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    # "local" loads site/local.zeek: JSON logs and the JA4+ package.
    command: ["zeek", "-i", "netsentinel-lab", "-C", "local"]
    working_dir: /var/log/zeek
    volumes:
      - zeek-logs:/var/log/zeek
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
    mem_limit: 1g
    restart: unless-stopped

  # --- pipeline: the detection path -------------------------------------------
  #
  # One image (pipeline/Dockerfile), one process per service. Artefacts are mounted
  # read-only from the repository's artefacts/, never baked in. Needs storage and bus
  # named with it, because compose refuses a dependency on an unselected service:
  #
  #   docker compose --profile storage --profile bus --profile pipeline up -d --build
  #
  # The writer and the Suricata importer write through the API's schema, so the app
  # profile has to have run its migrations first, and the sensor reads which models
  # are active from the running API; see README "pipeline".

  sensor:
    <<: &pipeline
      build:
        context: ..
        dockerfile: infra/pipeline/Dockerfile
      image: netsentinel/pipeline:0.1.0
      profiles: [pipeline]
      restart: unless-stopped
    # Host networking, like Suricata: it captures the lab bridge. Redpanda advertises
    # itself as redpanda:9092, which the host cannot resolve, so the name is pointed
    # at the port published on 127.0.0.1. The API is reached the same way, on the
    # port the app profile publishes.
    network_mode: host
    extra_hosts: ["redpanda:127.0.0.1"]
    # For tcpdump, which holds matching file capabilities; the process is not root.
    cap_add: [NET_ADMIN, NET_RAW]
    # Both Tier D models are loaded, and the model registry decides at start which
    # one scores active: a model it does not list runs in shadow, and an API that
    # cannot be reached stops the sensor until the restart policy tries again. See
    # README "pipeline".
    command:
      - netsentinel-sensor
      - --interface=netsentinel-lab
      - --brokers=redpanda:9092
      - --registry-url=http://127.0.0.1:${API_PORT:-8010}
      - --models
      - /artefacts/tier_a/model_card.json
      - /artefacts/tier_d_ae/model_card.json
      - /artefacts/tier_d/model_card.json
      - /artefacts/tier_b/model_card.json
    environment:
      NETSENTINEL_SENSOR_TOKEN: ${NETSENTINEL_SENSOR_TOKEN:-}
    volumes:
      - ../artefacts:/artefacts:ro
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 384m

  # Tier C: windows of flows off netsentinel.flows, per-flow scores onto
  # netsentinel.flows.tier_c. Always shadow.
  tier-c-scorer:
    <<: *pipeline
    command:
      - python
      - -m
      - netsentinel_scoring.window
      - --card=/artefacts/tier_c/model_card.json
      - --brokers=redpanda:9092
    volumes:
      - ../artefacts:/artefacts:ro
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 384m
    networks: [backplane]

  # Scored flows to explained detections in PostgreSQL. Refuses to start until the
  # Tier A card is registered and WRITER_SENSOR_ID names a sensors row (README).
  detection-writer:
    <<: *pipeline
    command:
      - netsentinel-writer
      - --card=/artefacts/tier_a/model_card.json
      - --family-card=/artefacts/family/model_card.json
      - --sensor-id=${WRITER_SENSOR_ID:-1}
      - --brokers=redpanda:9092
    environment: &pipeline-db
      NETSENTINEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-netsentinel}:${POSTGRES_PASSWORD}@postgres:5432/${NETSENTINEL_DB:-netsentinel}
      # Required by the API settings these processes load, though they sign nothing.
      NETSENTINEL_JWT_SECRET: ${NETSENTINEL_JWT_SECRET:-}
    volumes:
      - ../artefacts:/artefacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 384m
    networks: [backplane]

  # Every scored flow into ClickHouse network_flows.
  flow-sink:
    <<: *pipeline
    command:
      - netsentinel-flow-sink
      - --brokers=redpanda:9092
      - --clickhouse=http://clickhouse:8123
    environment: &pipeline-clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-netsentinel}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    depends_on: &pipeline-sink-deps
      clickhouse:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 192m
    networks: [backplane]

  # Tier C's window scores into ClickHouse tier_c_scores.
  tier-c-sink:
    <<: *pipeline
    command:
      - netsentinel-tier-c-sink
      - --brokers=redpanda:9092
      - --clickhouse=http://clickhouse:8123
    environment: *pipeline-clickhouse
    depends_on: *pipeline-sink-deps
    mem_limit: 192m
    networks: [backplane]

  # Suricata's alerts into PostgreSQL alerts, every SURICATA_IMPORT_SECONDS. The
  # importer re-reads the whole eve.json and skips alerts it already holds, so a
  # repeat is harmless; a missing file (Suricata not up yet) fails that pass only.
  suricata-import:
    <<: *pipeline
    command:
      - sh
      - -c
      - |
        while true; do
          netsentinel-import-suricata --eve /var/log/suricata/eve.json
          sleep "$${SURICATA_IMPORT_SECONDS:-300}"
        done
    environment:
      <<: *pipeline-db
      SURICATA_IMPORT_SECONDS: ${SURICATA_IMPORT_SECONDS:-300}
    volumes:
      - suricata-logs:/var/log/suricata:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 192m
    networks: [backplane]

  # --- the lab --------------------------------------------------------------

  victim-web:
    image: nginx:1.27-alpine
    profiles: [lab]
    networks:
      lab:
        ipv4_address: 172.30.0.10
    mem_limit: 64m
    restart: unless-stopped

  victim-ssh:
    image: linuxserver/openssh-server:9.7_p1-r4-ls171
    profiles: [lab]
    environment:
      # A weak password on purpose: this is the brute-force target for the D14
      # hydra run. It is reachable only from the lab bridge.
      USER_NAME: labuser
      USER_PASSWORD: password123
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
    networks:
      lab:
        ipv4_address: 172.30.0.11
    mem_limit: 128m
    restart: unless-stopped

  benign-traffic:
    image: alpine:3.20
    profiles: [lab]
    # Steady, unremarkable traffic. Without it the models learn that "any traffic at
    # all" means an attack, which is the classic way a lab-trained IDS fails.
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1
        while true; do
          curl -s -o /dev/null http://172.30.0.10/ || true
          sleep $$(( (RANDOM % 5) + 2 ))
        done
    networks: [lab]
    mem_limit: 64m
    restart: unless-stopped

  attacker:
    image: instrumentisto/nmap:7.95
    profiles: [lab]
    # Idles until driven by hand: docker compose exec attacker nmap -sS 172.30.0.10
    entrypoint: ["sleep", "infinity"]
    networks:
      lab:
        ipv4_address: 172.30.0.100
    mem_limit: 128m
    restart: unless-stopped

  # --- dashboards -----------------------------------------------------------

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [dashboards]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 4.14.0 is the last release that supports Grafana 11.2; 4.15 needs 11.6.
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.14.0
      # Read by provisioning/datasources/clickhouse.yaml.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-netsentinel}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 256m
    networks: [backplane]
    restart: unless-stopped

  # --- threat intelligence and SOAR -----------------------------------------
  #
  # Both are enrichment. The pipeline detects, stores, explains and alerts with this
  # profile down; what it loses is the "known-bad" label on an alert and the
  # de-duplication in front of the analyst.

  misp-db:
    image: mariadb:10.11
    profiles: [intel]
    environment:
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:?set MISP_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MISP_DB_ROOT_PASSWORD:?set MISP_DB_ROOT_PASSWORD in .env}
    command: --innodb-buffer-pool-size=256M --innodb-change-buffering=none
    volumes:
      - misp-db:/var/lib/mysql
    mem_limit: 768m
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  misp-redis:
    image: redis:7-alpine
    profiles: [intel]
    command: redis-server --save "" --maxmemory 128mb --maxmemory-policy allkeys-lru
    mem_limit: 192m
    networks: [backplane]
    restart: unless-stopped

  misp:
    image: ghcr.io/misp/misp-docker/misp-core:v2.5.17
    profiles: [intel]
    depends_on:
      misp-db:
        condition: service_healthy
      misp-redis:
        condition: service_started
    environment:
      BASE_URL: ${MISP_BASE_URL:-http://localhost:8081}
      ADMIN_EMAIL: ${MISP_ADMIN_EMAIL:-admin@netsentinel.local}
      ADMIN_PASSWORD: ${MISP_ADMIN_PASSWORD:?set MISP_ADMIN_PASSWORD in .env}
      MYSQL_HOST: misp-db
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:?set MISP_DB_PASSWORD in .env}
      REDIS_HOST: misp-redis
      # Warninglists are what keep 8.8.8.8 out of the feed, and the sync asks MISP to
      # enforce them. They have to be loaded for that request to mean anything.
      ENABLE_DB_SETTINGS: "true"
    volumes:
      - misp-data:/var/www/MISP/app/files
    ports:
      - "127.0.0.1:8081:80"
    mem_limit: 1536m
    networks: [backplane]
    restart: unless-stopped

  keep:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-api:0.33.6
    profiles: [intel]
    environment:
      DATABASE_CONNECTION_STRING: sqlite:////state/keep.db
      KEEP_API_KEY: ${KEEP_API_KEY:?set KEEP_API_KEY in .env}
      AUTH_TYPE: ${KEEP_AUTH_TYPE:-NO_AUTH}
      SECRET_MANAGER_TYPE: FILE
      SECRET_MANAGER_DIRECTORY: /state
    volumes:
      - keep-data:/state
    ports:
      - "127.0.0.1:8082:8080"
    mem_limit: 512m
    networks: [backplane]
    restart: unless-stopped

  # --- response -------------------------------------------------------------

  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.3
    profiles: [response]
    environment:
      # The Local API only. CrowdSec's own log parsers and scenarios are a second
      # detection engine, and this deployment already has one: decisions here come
      # from an analyst approving an action, not from CrowdSec deciding by itself.
      DISABLE_AGENT: "true"
      DISABLE_ONLINE_API: "true"
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
    ports:
      # The responder reaches this over the backplane; the port is published so
      # `cscli` on the host can register machines and bouncers.
      - "127.0.0.1:8080:8080"
    mem_limit: 256m
    networks: [backplane]
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # --- hids: Wazuh single node ---------------------------------------------
  #
  # The wazuh/wazuh-docker v4.14.8 single-node layout: service names, mounts and
  # config files as upstream ships them (config under wazuh/config), because the
  # certificates are issued to these hostnames. What differs is deliberate: every
  # port on 127.0.0.1, memory caps, and the indexer's user file kept out of git.
  #
  # Certificates first, once: docker compose --profile hids-certs run --rm wazuh-certs
  # Nothing here starts without them; see README "hids: Wazuh and Sysmon".

  wazuh-certs:
    image: wazuh/wazuh-certs-generator:0.0.4
    profiles: [hids-certs]
    environment:
      CERT_TOOL_VERSION: "4.14"
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/:/certificates/
      - ./wazuh/config/certs.yml:/config/certs.yml:ro
    # Downloads Wazuh's certs tool for CERT_TOOL_VERSION, so it needs the network.
    mem_limit: 256m
    restart: "no"

  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.8
    profiles: [hids]
    hostname: wazuh.manager
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      # The API account the dashboard uses, and the one the responder authenticates
      # as (NETSENTINEL_WAZUH_USER / NETSENTINEL_WAZUH_PASSWORD). Wazuh enforces a
      # policy on it: 8-64 characters with upper, lower, digit and symbol.
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:-}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
    ports:
      # 1514 agent events, 1515 enrolment, 55000 the API the responder calls. An
      # agent off the VM (the laptop's Sysmon) reaches 1514/1515 through the SSH
      # tunnel like everything else.
      - "127.0.0.1:1514:1514"
      - "127.0.0.1:1515:1515"
      - "127.0.0.1:55000:55000"
    mem_limit: 1g
    networks: [backplane]
    restart: unless-stopped

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.8
    profiles: [hids]
    hostname: wazuh.indexer
    environment:
      # The plan's tuning (M1 §7.4): a 1 GB heap, Xms = Xmx so it never resizes.
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      # Created from internal_users.example.yml during setup; gitignored.
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    # Not published: only the manager and the dashboard talk to it.
    # 1 GB heap plus Lucene's off-heap buffers.
    mem_limit: 1536m
    networks: [backplane]
    restart: unless-stopped

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.8
    profiles: [hids]
    hostname: wazuh.dashboard
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:-}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:-}
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      # wazuh.yml is generated into this volume from API_USERNAME/API_PASSWORD on
      # first start, rather than mounted with a password written in it.
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    ports:
      - "127.0.0.1:5601:5601"
    mem_limit: 512m
    networks: [backplane]
    restart: unless-stopped

  # --- case: DFIR-IRIS ------------------------------------------------------
  #
  # iris-web v2.4.29's own compose (app, worker, db, rabbitmq, nginx), flattened: the
  # upstream file `extends` a base file and reads a .env of its own. v2.4.29 is the
  # release services/cases.py was verified against. Service names carry an iris-
  # prefix, so the hostnames upstream hard-codes (db, app, rabbitmq) are set here.
  # The web certificate is generated once; see README "case: DFIR-IRIS".

  iris-rabbitmq:
    # Upstream says 3-management-alpine; 3.13.7 is the last 3.x release it resolves to.
    image: rabbitmq:3.13.7-management-alpine
    profiles: [case]
    mem_limit: 256m
    networks: [backplane]
    restart: unless-stopped

  iris-db:
    image: ghcr.io/dfir-iris/iriswebapp_db:v2.4.29
    profiles: [case]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${IRIS_DB_PASSWORD:-}
      POSTGRES_ADMIN_USER: raptor
      POSTGRES_ADMIN_PASSWORD: ${IRIS_DB_ADMIN_PASSWORD:-}
      POSTGRES_DB: iris_db
    volumes:
      - iris-db-data:/var/lib/postgresql/data
    mem_limit: 256m
    networks: [backplane]
    restart: unless-stopped

  iris-app:
    image: ghcr.io/dfir-iris/iriswebapp_app:v2.4.29
    profiles: [case]
    command: ["nohup", "./iris-entrypoint.sh", "iriswebapp"]
    environment: &iris-env
      DOCKERIZED: "1"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${IRIS_DB_PASSWORD:-}
      POSTGRES_ADMIN_USER: raptor
      POSTGRES_ADMIN_PASSWORD: ${IRIS_DB_ADMIN_PASSWORD:-}
      POSTGRES_SERVER: iris-db
      POSTGRES_PORT: "5432"
      IRIS_SECRET_KEY: ${IRIS_SECRET_KEY:-}
      IRIS_SECURITY_PASSWORD_SALT: ${IRIS_SECURITY_PASSWORD_SALT:-}
      CELERY_BROKER: amqp://iris-rabbitmq
      IRIS_AUTHENTICATION_TYPE: local
      # Seeded on first start only. Setting the API key here, rather than reading
      # the one IRIS generates, is what lets NETSENTINEL_IRIS_API_KEY be written
      # down before the case profile has ever run.
      IRIS_ADM_USERNAME: administrator
      IRIS_ADM_EMAIL: admin@netsentinel.local
      IRIS_ADM_PASSWORD: ${IRIS_ADM_PASSWORD:-}
      IRIS_ADM_API_KEY: ${IRIS_ADM_API_KEY:-}
    volumes:
      - iris-downloads:/home/iris/downloads
      - iris-user-templates:/home/iris/user_templates
      - iris-server-data:/home/iris/server_data
    depends_on:
      - iris-rabbitmq
      - iris-db
    mem_limit: 640m
    networks: [backplane]
    restart: unless-stopped

  iris-worker:
    image: ghcr.io/dfir-iris/iriswebapp_app:v2.4.29
    profiles: [case]
    command: ["./wait-for-iriswebapp.sh", "iris-app:8000", "./iris-entrypoint.sh", "iris-worker"]
    environment: *iris-env
    volumes:
      - iris-downloads:/home/iris/downloads
      - iris-user-templates:/home/iris/user_templates
      - iris-server-data:/home/iris/server_data
    depends_on:
      - iris-rabbitmq
      - iris-db
      - iris-app
    mem_limit: 384m
    networks: [backplane]
    restart: unless-stopped

  iris-nginx:
    image: ghcr.io/dfir-iris/iriswebapp_nginx:v2.4.29
    profiles: [case]
    environment:
      IRIS_UPSTREAM_SERVER: iris-app
      IRIS_UPSTREAM_PORT: "8000"
      INTERFACE_HTTPS_PORT: "443"
      SERVER_NAME: localhost
      CERT_FILENAME: iris.pem
      KEY_FILENAME: iris.key
      IRIS_AUTHENTICATION_TYPE: local
    volumes:
      - ./iris/certificates:/www/certs:ro
    depends_on:
      - iris-app
    # The API reaches this as https://iris-nginx on the backplane, or
    # https://127.0.0.1:8443 from the host. The certificate is self-signed; the API
    # trusts it rather than turning verification off (see README).
    ports:
      - "127.0.0.1:8443:443"
    mem_limit: 64m
    networks: [backplane]
    restart: unless-stopped

  # --- scan: Greenbone Community Edition --------------------------------------
  #
  # Greenbone's community compose (greenbone.github.io/docs, 22.4 containers), cut to
  # what services/vulns.py needs: a report from gvm-cli over the gvmd socket. The web
  # UI chain (gsa, gsad, gvm-config, nginx) and the log-tail container are dropped;
  # everything below is upstream's services, volumes and dependencies, with memory
  # caps added and volume names prefixed gvm-.
  #
  # Greenbone publishes only moving tags (stable, latest), so every image is pinned by
  # digest as resolved on 2026-09-25. The feed images carry the NVTs and SCAP data
  # themselves: a newer feed means newer digests here, deliberately.
  #
  # ospd-openvas is the one that sends packets, so it alone also joins the lab bridge;
  # Docker keeps bridges apart, and a scanner on its own network would find nothing.

  vulnerability-tests:
    image: registry.community.greenbone.net/community/vulnerability-tests:latest@sha256:335eb5c772bbdcddc1c03e542b1af57bc03cfe7cdac2e48cad99ea2bfbc76396
    profiles: [scan]
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - gvm-vt-data:/mnt
    mem_limit: 64m

  notus-data:
    image: registry.community.greenbone.net/community/notus-data:latest@sha256:f695b5431fe653ac03ee1f74c7649ed3852315415730ef8471a2d24da19559c2
    profiles: [scan]
    environment:
      KEEP_ALIVE: 1
    volumes:
      - gvm-notus-data:/mnt
    mem_limit: 64m

  scap-data:
    image: registry.community.greenbone.net/community/scap-data:latest@sha256:335cc54d885003ad450520dab1a0b07a20b720a2e208c73111920b8cd3be5464
    profiles: [scan]
    environment:
      KEEP_ALIVE: 1
    volumes:
      - gvm-scap-data:/mnt
    mem_limit: 64m

  cert-bund-data:
    image: registry.community.greenbone.net/community/cert-bund-data:latest@sha256:697918e8d36969de50eec47a72374ce43efa611900dc42baa3af62286f814a07
    profiles: [scan]
    environment:
      KEEP_ALIVE: 1
    volumes:
      - gvm-cert-data:/mnt
    mem_limit: 64m

  dfn-cert-data:
    image: registry.community.greenbone.net/community/dfn-cert-data:latest@sha256:7c72365581cacc3fb3b32aa8bab35d3e353f4f47f9df5b42769886888c7b4f5e
    profiles: [scan]
    environment:
      KEEP_ALIVE: 1
    volumes:
      - gvm-cert-data:/mnt
    depends_on:
      cert-bund-data:
        condition: service_healthy
    mem_limit: 64m

  data-objects:
    image: registry.community.greenbone.net/community/data-objects:latest@sha256:2db1970ae9178c2b410989a2ac14f377c9b99fd286e44251a1cb0ee6fdf426cf
    profiles: [scan]
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - gvm-data-objects:/mnt
    mem_limit: 64m

  report-formats:
    image: registry.community.greenbone.net/community/report-formats:latest@sha256:32a4e29bcfff060214a0876e1dbd9db14ffe55452efb0b3da755d0e3f100cc3b
    profiles: [scan]
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - gvm-data-objects:/mnt
    depends_on:
      data-objects:
        condition: service_healthy
    mem_limit: 64m

  gpg-data:
    image: registry.community.greenbone.net/community/gpg-data:latest@sha256:3d82a9d944295ed06381ca6bccd112025f8e2be4f9f3f8b8ea4c2275b6758b2a
    profiles: [scan]
    volumes:
      - gvm-gpg-data:/mnt
    mem_limit: 64m

  redis-server:
    image: registry.community.greenbone.net/community/redis-server:latest@sha256:6da6a7c7221aa3ab231961fd6ca001d552b6a2c7727ac6201c6d8a360baa963a
    profiles: [scan]
    volumes:
      - gvm-redis-socket:/run/redis/
    # Holds the NVT metadata the scanner reads; the largest cache in the stack.
    mem_limit: 512m
    restart: unless-stopped

  pg-gvm:
    image: registry.community.greenbone.net/community/pg-gvm:stable@sha256:b81bc5d7a750203ea25c6e4dd086751ecee8e388d1cb2501c60b3805e0056204
    profiles: [scan]
    volumes:
      - gvm-psql-data:/var/lib/postgresql
      - gvm-psql-socket:/var/run/postgresql
    depends_on:
      pg-gvm-migrator:
        condition: service_completed_successfully
    mem_limit: 512m
    restart: unless-stopped

  pg-gvm-migrator:
    image: registry.community.greenbone.net/community/pg-gvm-migrator:stable@sha256:201da953f12dd26c84db8aa0117465de0aac9916f4e1d2d60b4fcb6f86176d4e
    profiles: [scan]
    volumes:
      - gvm-psql-data:/var/lib/postgresql
      - gvm-psql-socket:/var/run/postgresql
    mem_limit: 256m
    restart: "no"

  gvmd:
    image: registry.community.greenbone.net/community/gvmd:stable@sha256:a39b46668b55b8bf41d8ecf91430947482a6ed78c1bf37747a330e5b886c0eba
    profiles: [scan]
    volumes:
      - gvm-gvmd-data:/var/lib/gvm
      - gvm-scap-data:/var/lib/gvm/scap-data/
      - gvm-cert-data:/var/lib/gvm/cert-data
      - gvm-data-objects:/var/lib/gvm/data-objects/gvmd
      - gvm-vt-data:/var/lib/openvas/plugins
      - gvm-psql-data:/var/lib/postgresql
      - gvm-gvmd-socket:/run/gvmd
      - gvm-ospd-socket:/run/ospd
      - gvm-psql-socket:/var/run/postgresql
    depends_on:
      pg-gvm:
        condition: service_started
      scap-data:
        condition: service_healthy
      cert-bund-data:
        condition: service_healthy
      dfn-cert-data:
        condition: service_healthy
      data-objects:
        condition: service_healthy
      report-formats:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped

  # Writes openvas.conf and the log config into the shared volume, then exits.
  configure-openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:stable@sha256:5b950bc273d1d5d123f15dfb7f373b0b3a3b7fb75f67286dfa28e88350a6eb33
    profiles: [scan]
    volumes:
      - gvm-openvas-data:/mnt
      - gvm-openvas-log:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log
    mem_limit: 64m
    restart: "no"

  openvasd:
    image: registry.community.greenbone.net/community/openvas-scanner:stable@sha256:5b950bc273d1d5d123f15dfb7f373b0b3a3b7fb75f67286dfa28e88350a6eb33
    profiles: [scan]
    environment:
      # Notus (local security checks) only, as upstream ships it.
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - gvm-openvas-data:/etc/openvas
      - gvm-openvas-log:/var/log/openvas
      - gvm-gpg-data:/etc/openvas/gnupg
      - gvm-notus-data:/var/lib/notus
    depends_on:
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
      configure-openvas:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  ospd-openvas:
    image: registry.community.greenbone.net/community/ospd-openvas:stable@sha256:db44c0dbdc63b4f57b3a0a92d8af6882dfe4559bd4409a7dd0ce49d732230c82
    profiles: [scan]
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN # for capturing packages in promiscuous mode
      - NET_RAW # for raw sockets e.g. used for the boreas alive detection
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      [
        "ospd-openvas",
        "-f",
        "--config",
        "/etc/gvm/ospd-openvas.conf",
        "--notus-feed-dir",
        "/var/lib/notus/advisories",
        "-m",
        "666",
      ]
    volumes:
      - gvm-gpg-data:/etc/openvas/gnupg
      - gvm-vt-data:/var/lib/openvas/plugins
      - gvm-notus-data:/var/lib/notus
      - gvm-ospd-socket:/run/ospd
      - gvm-redis-socket:/run/redis/
      - gvm-openvas-data:/etc/openvas/
      - gvm-openvas-log:/var/log/openvas
    depends_on:
      redis-server:
        condition: service_started
      gpg-data:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
    networks: [default, lab]
    mem_limit: 1536m
    restart: unless-stopped

  # The GMP client, run on demand; see README "scan: Greenbone".
  gvm-tools:
    image: registry.community.greenbone.net/community/gvm-tools:latest@sha256:a3ec2b8d2281e1a0bea147f1a6fbe00d22eab26db1c114bebf7bb2beed0a5619
    profiles: [scan]
    volumes:
      - gvm-gvmd-socket:/run/gvmd
      - gvm-ospd-socket:/run/ospd
    depends_on:
      - gvmd
      - ospd-openvas
    mem_limit: 128m
