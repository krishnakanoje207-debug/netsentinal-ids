[project]
name = "netsentinel-copilot"
version = "0.1.0"
description = "Read-only LLM assistant: an alert summarised for an analyst, schema-checked"
requires-python = "==3.11.*"
# netsentinel-api is here for the ORM models and settings, as in the writer: the
# summary is stored through the same classes the API reads back.
#
# No LLM SDK. Ollama serves plain HTTP and httpx is already a dependency of the
# workspace; a client library would add a supply chain for one POST.
dependencies = [
    "netsentinel-api",
    "httpx>=0.27",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
]

[project.scripts]
netsentinel-copilot = "netsentinel_copilot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netsentinel_copilot"]

[tool.uv.sources]
netsentinel-api = { workspace = true }
