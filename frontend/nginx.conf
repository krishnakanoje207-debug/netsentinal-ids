server {
    # HTTPS only. A plain-HTTP request to the same port is answered with a redirect
    # to https on that port (nginx's 497 "HTTP sent to HTTPS port"), so the one
    # published port serves both and an old http:// bookmark still works.
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/tls/dashboard.crt;
    ssl_certificate_key /etc/nginx/tls/dashboard.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 =301 https://$http_host$request_uri;
    root /usr/share/nginx/html;

    # Nothing about the server in error pages or headers.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The API and the alert stream, same origin as the page.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The alert feed is a WebSocket under /api.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A single-page app: every other path is the dashboard's to route.
    location / {
        try_files $uri /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
