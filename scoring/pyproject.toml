[project]
name = "netsentinel-scoring"
version = "0.1.0"
description = "The fusion scorer: ONNX inference over the feature contract, with explanations"
requires-python = "==3.11.*"
# Its own package rather than part of core or sensors. It is M2's layer 4, it runs
# in-process next to the sensor on the VM, and it needs onnxruntime - which core,
# imported everywhere, must not drag in.
dependencies = [
    "netsentinel-core",
    "numpy>=1.26",
    "onnxruntime>=1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netsentinel_scoring"]

[tool.uv.sources]
netsentinel-core = { workspace = true }
