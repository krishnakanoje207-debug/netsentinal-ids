# uv workspace root. Not a package itself - it exists to pin one interpreter, one
# lockfile and one test command across the whole monorepo, while each member keeps
# its own dependency list. That boundary is the point: the API must not be able to
# import LightGBM by accident, and the sensor must stay installable without it.
[tool.uv.workspace]
members = ["backend", "core", "scoring", "training"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    # fastapi.testclient is built on httpx
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "core/tests", "scoring/tests", "training/tests"]
