# uv workspace root. Not a package itself - it exists to pin one interpreter, one
# lockfile and one test command across the whole monorepo, while each member keeps
# its own dependency list. That boundary is the point: the API must not be able to
# import LightGBM by accident, and the sensor must stay installable without it.
[tool.uv.workspace]
members = ["backend", "copilot", "core", "scoring", "sensors", "training", "writer"]

[tool.uv]
package = false
# Both groups sync by default so the local environment is one command. Deployment installs
# individual members (core, scoring, sensors) rather than syncing the whole workspace, so
# the VM never pulls torch.
default-groups = ["dev", "deep"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # fastapi.testclient is built on httpx
    "httpx>=0.27",
]
# Tiers B and C train on Kaggle GPU, but the training scripts are developed and tested
# here, so a CPU build is needed locally. Declared as a group rather than left to a manual
# `uv pip install`, which `uv sync` prunes on the next run.
deep = [
    "torch>=2.4",
    # torch.onnx.export uses the dynamo exporter by default from 2.9 onward, which needs
    # this. The alternative is dynamo=False, and the legacy exporter is on its way out.
    "onnxscript>=0.1",
]

# Explicit index: the default PyPI torch wheel bundles CUDA and is several gigabytes,
# which will not fit on this machine's system drive.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = [
    "backend/tests",
    "copilot/tests",
    "core/tests",
    "scoring/tests",
    "sensors/tests",
    "training/tests",
    "writer/tests",
]
