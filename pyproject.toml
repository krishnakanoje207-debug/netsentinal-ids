[project]
name = "netsentinel"
version = "0.1.0"
description = "NetSentinel-AI: intrusion detection and cyber security monitoring using machine learning"
requires-python = "==3.11.*"
dependencies = [
    "dpkt>=1.9.8",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netsentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
