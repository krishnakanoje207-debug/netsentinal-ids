[project]
name = "netsentinel-api"
version = "0.1.0"
description = "FastAPI application: alert triage, the approval gate, and the audit trail"
requires-python = "==3.11.*"
# Note: netsentinel-core, never netsentinel-training. The API reads the feature
# contract to render SHAP explanations; it must not be able to pull in LightGBM.
dependencies = [
    "netsentinel-core",
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    # Deviating from M2 s4, which names python-jose and implies passlib:
    # python-jose is effectively unmaintained and has a CVE history, and passlib's
    # last release predates Python 3.11. PyJWT and bcrypt are the maintained
    # equivalents. On a security project the weaker choice is hard to defend, and
    # nothing in the design depends on either library specifically.
    "bcrypt>=4.2",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netsentinel_api"]

[tool.uv.sources]
netsentinel-core = { workspace = true }
