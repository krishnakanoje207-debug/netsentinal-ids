[project]
name = "netsentinel-core"
version = "0.1.0"
description = "Shared feature contract and flow extraction, imported by every other package"
requires-python = "==3.11.*"
# Deliberately tiny. core is imported by the sensor on a constrained host and by
# the API, so anything heavy added here is paid for in three places.
dependencies = [
    "dpkt>=1.9.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netsentinel_core"]
